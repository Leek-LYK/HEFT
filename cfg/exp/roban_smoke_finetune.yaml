# @package _global_

# Bounded Roban PPO smoke settings selecting the official Student PPO phase.
defaults:
  - override /algo: ppo_finetune

algo:
  train_every: 8
  ppo_epochs: 1
  num_minibatches: 1
  init_noise_scale: 1.0
  init_noise_scale_overrides:
    "^waist_yaw_joint$": 1.5
    "^leg_[lr][1-4]_joint$": 1.5
    "^leg_[lr][5-6]_joint$": 1.0
    "^zarm_[lr][1-4]_joint$": 1.2
  load_noise_scale: null

task:
  num_envs: 64
  student_train: true
  profile:
    command:
      dataset:
        groups:
          - name: ppo_smoke
            teacher_mem_path: _smoke/roban/main_subset
            weight: 1.0
  reward:
    loco:
      action_rate_l2: {weight: 0.1, enabled: true}

total_frames: 1024
save_interval: -1
headless: true
eval_render: false

app:
  headless: true
  enable_cameras: false

train_record:
  enabled: false

wandb:
  mode: disabled

smoke:
  enabled: true
  output_dir: ${oc.env:PPO_SMOKE_ROOT,./dataset/_audit/roban_ominisoma/ppo_smoke}/finetune

hydra:
  run:
    dir: ${smoke.output_dir}
  job:
    chdir: true

