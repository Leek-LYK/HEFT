hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}-${task.name}-${algo.name}
  job:
    chdir: true

headless: true
exp_name: ${oc.select:task.name,test}-${oc.select:algo.name,none}

app:
  headless: ${..headless}
  enable_cameras: ${..eval_render}

total_frames: 4000_000_000
start_iter: 0
# Bound a validation run without compressing the full training curriculum.
stop_after_rollouts: null
eval_render: false
save_interval: 150
seed: 0
checkpoint_path: null
vecnorm: ${oc.select:algo.vecnorm,train}

# Robot profiles may opt into a deployment-specific Student latent contract.
# The fallbacks preserve the official PPO defaults for G1/L7 and old configs.
algo:
  latent_dim: ${oc.select:task.profile.policy.latent_dim,256}
  student_latent_quantizer:
    enabled: ${oc.select:task.profile.policy.student_latent_quantizer.enabled,false}
    scale: ${oc.select:task.profile.policy.student_latent_quantizer.scale,4.499549865722656}

camera_follow: false

train_record:
  enabled: false
  interval: 50
  envs: 16
  steps: 500
  output_dir: train_records

# Optional local TensorBoard logging. Only rank 0 writes event files. When
# log_dir is null, diagnostic runs use their output_dir/tensorboard and regular
# Hydra runs use the current run directory/tensorboard.
tensorboard:
  enabled: true
  log_dir: null
  flush_secs: 10

wandb:
  name: ${..exp_name}/${now:%m-%d}_${now:%H-%M}
  job_type: train
  project: heft # change this to your own project if you want to log to wandb
  mode: disabled # Local checkpoints and TensorBoard do not require W&B
  tags: []
  id: null
  notes: null
  settings:
    http_proxy: null
    https_proxy: null

defaults:
  - task: tracking
  - algo: ppo_train
  - _self_
